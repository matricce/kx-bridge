name: Nightly Build

on:
  push:
    branches:
      - nightly
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Gitea registry
        uses: docker/login-action@v3
        with:
          registry: gitea.it-drui.de
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build & push (amd64 + arm64)
        run: |
          DATE=$(date +%Y%m%d)
          TAGS="gitea.it-drui.de/viewit/kx-bridge:nightly"
          TAGS="$TAGS,gitea.it-drui.de/viewit/kx-bridge:nightly-$DATE"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            --provenance=false \
            --no-cache \
            $(echo "$TAGS" | tr ',' '\n' | sed 's/^/-t /') \
            .

      - name: Set nightly tag
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          DATE=$(date +%Y%m%d)
          TAG="nightly-$DATE"
          git config user.name "gitea-actions"
          git config user.email "actions@it-drui.de"
          git tag -f "$TAG"
          git push origin "$TAG" --force
