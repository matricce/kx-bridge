name: PR Check

on:
  pull_request:
    branches:
      - nightly

jobs:
  lint-and-test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependencies installieren
        run: pip install -r requirements.txt

      - name: Lint
        run: |
          pip install flake8
          flake8 *.py --max-line-length=120 --extend-ignore=E501

      - name: Tests
        run: |
          pip install pytest
          pytest tests/ -v
        if: ${{ hashFiles('tests/') != '' }}
