name: PR Check

on:
  pull_request:
    branches:
      - nightly

jobs:
  lint-and-test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies installieren
        run: pip3 install -r requirements.txt

      - name: Lint
        run: |
          pip3 install flake8
          flake8 *.py --max-line-length=120 --extend-ignore=E501

      - name: Tests
        run: |
          pip3 install pytest
          pytest tests/ -v
        if: ${{ hashFiles('tests/') != '' }}
