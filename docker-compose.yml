services:
  kx-bridge:
    #image: gitea.it-drui.de/viewit/kx-bridge:latest
    # Selbst bauen statt das Registry-Image zu pullen?
    # Dann image-Zeile auskommentieren und folgende aktivieren:
    build: .
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./.env:/app/.env:ro
    ports:
      - "7125-7130:7125-7130"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
