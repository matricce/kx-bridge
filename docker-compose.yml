services:
  kx-bridge:
    image: kx-bridge:latest
    build: .
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./.env:/app/.env:ro
    ports:
      - "7125-7130:7125-7130"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
